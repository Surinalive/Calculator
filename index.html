<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div id="calculator">
        <div id="display">
            <label for="numbers">5499</label> <!-- Not sure if this is appropriate yet-->
            <button id="clear">clear</button>
        </div>
        <div id="keypad">
            <div id="firstThreeAdd">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button id="add">+</button>
            </div>
            <div id="secondThreeSubtract">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button id="subtract">-</button>
            </div>
            <div id="thirdThreeMultiply">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button id="multiply">*</button>
            </div>
            <div id="zeroDivide">
                <button>0</button>
                <button id="dot">.</button>
                <button id="negate">+/-</button>
                <button id="divide">/</button>
            </div>
            <div id="compute">
                <button id="equal">=</button>
            </div>
        </div>
    </div>
    
</body>
</html>
